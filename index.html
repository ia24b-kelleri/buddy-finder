<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden – BuddyFinder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="center">
  <div class="card">
    <h1>Anmelden</h1>
    <p class="subtitle">Melde dich bei BuddyFinder an.</p>

    <form id="form-login" novalidate>
      <div class="field">
        <label for="login-email">E-Mail</label>
        <input type="email" id="login-email" placeholder="name@beispiel.de" required />
      </div>
      <div class="field">
        <label for="login-password">Passwort</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="primary">Anmelden</button>
      <div id="login-msg" class="message"></div>
    </form>

    <div class="toggle-row">
      <span>Noch kein Konto?</span>
      <a class="linklike" href="register.html">Registrieren</a>
    </div>

    <footer><a href="datenschutz.html">Datenschutz</a></footer>
  </div>

  <script src="app.js"></script>
  <script>
    // Bereits eingeloggt? Direkt zur Übersicht.
    if (getToken()) location.href = 'dashboard.html';

    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      clearMsg('login-msg');
      const email = document.getElementById('login-email').value.trim();
      const passwort = document.getElementById('login-password').value;
      if (!email || !passwort) return showMsg('login-msg', 'Bitte alle Felder ausfüllen.', 'error');

      try {
        const { ok, data } = await api('/login', { method: 'POST', body: { email, passwort } });
        if (!ok) return showMsg('login-msg', data.error || 'Anmeldung fehlgeschlagen.', 'error');
        localStorage.setItem('token', data.token);
        localStorage.setItem('userName', data.user?.name || email);
        location.href = 'dashboard.html';
      } catch {
        showMsg('login-msg', 'Server nicht erreichbar. Läuft das Backend (npm start)?', 'error');
      }
    });
  </script>
</body>
</html>
